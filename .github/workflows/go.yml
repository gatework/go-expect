name: Go
on:
  push:
    branches: ['**']
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: go.sum
      - run: bash script/ci
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Validate workflow and release automation
        run: |
          # GitHub supports queue:max; actionlint 1.7.12 has not added that key yet.
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore '^unexpected key "queue" for "concurrency" section\.'
          python3 -m unittest discover -s script/tests -v
  package:
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Package the tested commit and verify the extracted consumer
        run: |
          python3 script/release.py package
          mkdir "$RUNNER_TEMP/source-consumer"
          tar -xzf dist/source.tar.gz -C "$RUNNER_TEMP/source-consumer"
          bash "$RUNNER_TEMP/source-consumer/go-expect/script/consumer"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: source-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  release:
    needs: [test, quality, package]
    if: >-
      github.repository == 'gatework/go-expect' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: go-expect-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: dist
      - name: Publish or verify the same commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/release.py release --publish
