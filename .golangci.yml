version: '2'
run:
  timeout: 5m
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - revive
    - exhaustive
    - contextcheck
    - errname
    - gocyclo
    - funlen
    - modernize
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
        - name: var-naming
        - name: error-naming
        - name: error-strings
        - name: package-comments
        - name: blank-imports
        - name: context-as-argument
    gocyclo:
      min-complexity: 45
    funlen:
      lines: 160
      statements: 100
      ignore-comments: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gocyclo, funlen, contextcheck]
